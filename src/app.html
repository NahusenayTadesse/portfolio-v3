<!doctype html>
<html lang="en" >
	<head>
		<meta charset="utf-8" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="icon" href="%sveltekit.assets%/logo1.webp" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#16212a" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f7f9f9" media="(prefers-color-scheme: light)" />
		<script>
			// Dark is the default; only an explicit choice opts out. Runs before
			// first paint so the page never flashes the wrong theme.
			// Key matches flowbite-svelte's DarkMode toggle, which stores under the
			// literal string "THEME_PREFERENCE_KEY".
			try {
				var stored = localStorage.getItem('THEME_PREFERENCE_KEY');
				document.documentElement.classList.toggle('dark', stored !== 'light');
			} catch (e) {
				document.documentElement.classList.add('dark');
			}

			// Arms the scroll-reveal hidden state. It lives here, before first
			// paint, so revealed content is never painted visible and then
			// yanked away once hydration runs. Without JavaScript the class is
			// never added and the page stays plainly visible.
			document.documentElement.classList.add('js-motion');

			// Watchdog: if the bundle never hydrates, nothing would ever clear
			// the hidden state and the visitor would be left staring at a blank
			// page. Better a page with no animation than no page.
			setTimeout(function () {
				if (document.documentElement.dataset.revealReady !== 'true') {
					document.documentElement.classList.remove('js-motion');
				}
			}, 4000);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-canvas text-ink dark:bg-gradient-to-br dark:from-primary-700 dark:to-secondary-900 dark:text-gray-100">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
